<html>
  <head>
    <link rel="stylesheet" href="../../theme.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="header">
      <h1 style="align-self: center;">Book Log</h1>
      <h4>Goal: <span>Read at least 12 books per year.</span></h4>
      <h4>Format: <span>#. Title (Month Finished)</span></h4>
      <h4>Easter Eggs: <span>Can you tell which books I slogged through?</span></h4>
    </div>
    <div id="book-log">
      <!--
      This section is split into 3 parts:
      1. The year selector. It will always select the current year first!
      2. The list of books for the selected year.
      3. The book cover image for the current-hovered book.
      -->
      <div id="years-books" style="display: flex; flex-direction: row;">
        <div id="years"></div>
        <div id="books"></div>
      </div>
      <div id="book-cover">
        <img id="cover" src="" alt="Book Cover" class="nodisp" />
        <div id="placeholder">Click on a book to see its cover!</div>
      </div>
    </div>
    <script>
      const loaded = {};
      const yearsContainer = document.getElementById("years");
      const spinner = document.createElement("div");
      spinner.classList.add("spinner");

      const currentYear = new Date().getFullYear();
      let cur = currentYear;
      // I started keeping track in 2024, hence the magic number.
      while (cur >= 2024) {
        const yearButton = document.createElement("button");
        yearButton.id = `year-${cur}`;
        yearButton.innerText = cur;
        yearButton.addEventListener("click", (e) => {
          // Clear any previously selected book
          clearBook();

          button = e.target;

          // First, remove the "active" state from the previously active button
          document.querySelectorAll(`#years button`).forEach((button) => {
            button.classList.remove("selected");
          });
          button.classList.add("selected");

          // Lazy loading the books
          if (!loaded[button.innerText]) {
            // Loading spinner while we fetch!
            loaded[button.innerText] = spinner;
            document.getElementById("books").replaceChildren(spinner);

            fetchBooks(button.innerText).then((div) => {
              loaded[button.innerText] = div; // Cache in memory
              document.getElementById("books").replaceChildren(div);
            });
          }
          document.getElementById("books").replaceChildren(loaded[button.innerText]);
        });
        yearsContainer.appendChild(yearButton);

        // Onto the next year!
        cur--;
      }

      // Load the first year!
      setTimeout(() => {
        document.getElementById(`year-${currentYear}`).click();
      }, 0);

      async function fetchBooks(year) {
          const response = await fetch(`./years/${year}.txt`);
          const responseText = await response.text();
          
          const yearContainer = document.createElement("div");

          const yearBookList = document.createElement("ol");
          const books = responseText.split("\n");
          for (book of books) {
            if (!book.length) {
              continue;
            }
            const [title, month, isbn, coverSrc] = book.split("|");
            const bookItem = document.createElement("li");
            if (!!isbn) {
              bookItem.setAttribute("data-source", `https://www.isbnsearch.org/isbn/${isbn}`);
            }
            if (!!coverSrc) {
              bookItem.setAttribute("data-cover-source", `https://images.isbndb.com/covers/${coverSrc}.jpg`);
              bookItem.addEventListener("click", (e) => selectBook(e));
            }
            bookItem.innerText = title + " (" + month + ")";
            yearBookList.appendChild(bookItem);
          }
          yearContainer.appendChild(yearBookList);
          return yearContainer;
      }

      // We want to show the book cover when the user hovers over a book link,
      // so we'll use window-level mouseover and mouseoutevents

      function selectBook(e) {
        const book = e.target;
        const source = book.getAttribute("data-source");
        const coverSource = book.getAttribute("data-cover-source");

        // First, remove the "active" state from the previously active book
        
        document.querySelectorAll(`#books li`).forEach((li) => {
          li.classList.remove("selected");
        });
        book.classList.add("selected");

        const bookCover = document.getElementById("cover");
        bookCover.src = coverSource;
        bookCover.onclick = () => window.open(source, "_blank")
        bookCover.classList.remove("nodisp");

        const placeholder = document.getElementById("placeholder");
        placeholder.classList.add("nodisp");
      }

      function clearBook() {
          document.querySelectorAll(`#books li`).forEach((li) => {
            li.classList.remove("selected");
          });

          const placeholder = document.getElementById("placeholder");
          placeholder.classList.remove("nodisp");

          const bookCover = document.getElementById("cover");
          bookCover.src = "";
          bookCover.classList.add("nodisp");
      }
    </script>
  </body>
</html>
