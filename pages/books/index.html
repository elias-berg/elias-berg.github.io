<html>
  <head>
    <link rel="stylesheet" href="../../theme.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h2>Book Log</h2>
    <h3>The goal: read at least one book per month/more than 12 books per year!</h3>
    <div id="books">
        <!-- Books will go here! -->
    </div>
    <script>
      const container = document.getElementById("books");
      async function fetchBooks(year) {
          const response = await fetch(`./years/${year}.txt`);
          const responseText = await response.text();
          
          const yearContainer = document.createElement("div");
          const yearTitle = document.createElement("h4");
          yearTitle.innerText = year;
          yearContainer.appendChild(yearTitle);

          const yearBookList = document.createElement("ol");
          const books = responseText.split("\n");
          for (book of books) {
            const [title, month, isbn] = book.split("|");
            bookItem = document.createElement("li");
            if (!!isbn) {
              bookItem.innerHTML = `<a href='https://www.isbnsearch.org/isbn/${isbn}' target='_blank'>${title + " (" + month + ")"}<div style="width: 150px; height: 225px; background: url(https://images.isbndb.com/covers/8348053482663.jpg); background-size: contain;"></div></a>`;
            } else {
              bookItem.innerText = title + " (" + month + ")";
            }
            yearBookList.appendChild(bookItem);
          }
          yearContainer.appendChild(yearBookList);
          return yearContainer;
      }

      async function hydrateBooks() {
        const byYear = {};
        const promises = [];
        await Promise.all([2024, 2025, 2026].map((year) => 
          fetchBooks(year).then((div) => byYear[year] = div)
        ));
        for (year of Object.values(byYear)) {
          container.appendChild(year);
        }
      }
      hydrateBooks();
    </script>
  </body>
</html>
